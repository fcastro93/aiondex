# Builds and publishes a signed release when the owner pushes a version tag (vX.Y.Z).
# Only the repository owner can create v* tags (tag ruleset), and the signing key lives in the
# "release" environment, which only runs for v* tags.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write          # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Version must match the tag
        id: version
        shell: pwsh
        run: |
          $v = python -c "import pet_overlay; print(pet_overlay.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "El tag ${{ github.ref_name }} no coincide con __version__ v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build app and installer
        run: python build_exe.py --installer

      - name: Sign update manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python tools/sign_release.py "dist/installer/AionDex-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" `
            "dist/installer/AionDex-Setup-$v.exe" "dist/installer/latest.json" "dist/installer/latest.json.sig" `
            --title "AionDex $v" --generate-notes --repo "${{ github.repository }}"
